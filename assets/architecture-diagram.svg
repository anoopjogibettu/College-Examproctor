<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="500" style="background:#0f172a; border-radius:8px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="450" y="42" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    ProctorAI System Architecture &amp; Data Flow
  </text>
  <line x1="300" y1="56" x2="600" y2="56" stroke="#334155" stroke-width="1" />

  <!-- Layer 1: Client Application (Left) -->
  <g transform="translate(40, 80)" filter="url(#shadow)">
    <rect width="250" height="380" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="42" rx="8" fill="#1e293b" />
    <text x="125" y="27" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">CLIENT LAYER (Vite + React)</text>

    <!-- Sub components inside Client -->
    <g transform="translate(15, 60)">
      <rect width="220" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="110" y="26" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">Student / Admin UI</text>
      <text x="110" y="44" font-size="10" fill="#94a3b8" text-anchor="middle">Exam Rooms &amp; Management Views</text>
    </g>

    <g transform="translate(15, 135)">
      <rect width="220" height="70" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="110" y="25" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">face-api.js ML Engine</text>
      <text x="110" y="42" font-size="10" fill="#94a3b8" text-anchor="middle">SSD MobileNet V1 + Landmarks</text>
      <text x="110" y="58" font-size="10" fill="#64748b" text-anchor="middle">Client-Side 128D Descriptors</text>
    </g>

    <g transform="translate(15, 220)">
      <rect width="220" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="110" y="26" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">Security &amp; Proctor Sensors</text>
      <text x="110" y="44" font-size="10" fill="#94a3b8" text-anchor="middle">Tab Focus Loss / Multi-Face Flags</text>
    </g>

    <g transform="translate(15, 300)">
      <rect width="220" height="55" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="110" y="25" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">Socket.IO Client</text>
      <text x="110" y="42" font-size="10" fill="#94a3b8" text-anchor="middle">Real-time Warning Receiver</text>
    </g>
  </g>

  <!-- Connectors from Client to Server -->
  <!-- HTTP REST -->
  <path d="M 290 170 L 350 170" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="350,170 342,165 342,175" fill="#38bdf8" />
  <text x="320" y="160" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">HTTPS</text>

  <!-- WebSocket -->
  <path d="M 290 350 L 350 350" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="350,350 342,345 342,355" fill="#a78bfa" />
  <polygon points="290,350 298,345 298,355" fill="#a78bfa" />
  <text x="320" y="340" font-size="10" font-weight="600" fill="#a78bfa" text-anchor="middle">WSS</text>

  <!-- Layer 2: Backend Application (Middle) -->
  <g transform="translate(350, 80)" filter="url(#shadow)">
    <rect width="250" height="380" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="42" rx="8" fill="#1e293b" />
    <text x="125" y="27" font-size="14" font-weight="700" fill="#818cf8" text-anchor="middle">SERVER LAYER (Node + Express)</text>

    <!-- Sub components inside Server -->
    <g transform="translate(15, 60)">
      <rect width="220" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="110" y="26" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">REST API Controllers</text>
      <text x="110" y="44" font-size="10" fill="#94a3b8" text-anchor="middle">Auth, Exams, Attempts, Admin</text>
    </g>

    <g transform="translate(15, 135)">
      <rect width="220" height="65" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
      <text x="110" y="26" font-size="12" font-weight="600" fill="#818cf8" text-anchor="middle">Security &amp; Auth Guard</text>
      <text x="110" y="44" font-size="10" fill="#94a3b8" text-anchor="middle">JWT Verification &amp; Role RBAC</text>
    </g>

    <g transform="translate(15, 215)">
      <rect width="220" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="110" y="26" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">Assessment &amp; Grading Core</text>
      <text x="110" y="44" font-size="10" fill="#94a3b8" text-anchor="middle">Autosave Engine &amp; MCQ Grader</text>
    </g>

    <g transform="translate(15, 295)">
      <rect width="220" height="65" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="1" />
      <text x="110" y="26" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle">Socket.IO Event Engine</text>
      <text x="110" y="44" font-size="10" fill="#94a3b8" text-anchor="middle">Live Warning Broadcaster</text>
    </g>
  </g>

  <!-- Connectors from Server to Database -->
  <path d="M 600 270 L 660 270" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="660,270 652,265 652,275" fill="#34d399" />
  <polygon points="600,270 608,265 608,275" fill="#34d399" />
  <text x="630" y="260" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">TCP/IP</text>

  <!-- Layer 3: Persistence & Mail (Right) -->
  <g transform="translate(660, 80)" filter="url(#shadow)">
    <rect width="200" height="380" rx="8" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="42" rx="8" fill="#1e293b" />
    <text x="100" y="27" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">DATA &amp; SERVICES</text>

    <!-- Sub components inside Database -->
    <g transform="translate(15, 60)">
      <rect width="170" height="75" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1" />
      <text x="85" y="26" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">MongoDB Store</text>
      <text x="85" y="46" font-size="10" fill="#94a3b8" text-anchor="middle">Users, Exams,</text>
      <text x="85" y="60" font-size="10" fill="#94a3b8" text-anchor="middle">Attempts &amp; Transcripts</text>
    </g>

    <g transform="translate(15, 150)">
      <rect width="170" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="85" y="26" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">Audit Logs</text>
      <text x="85" y="46" font-size="10" fill="#94a3b8" text-anchor="middle">Infraction Events &amp;</text>
      <text x="85" y="60" font-size="10" fill="#94a3b8" text-anchor="middle">Snapshot Evidence</text>
    </g>

    <g transform="translate(15, 240)">
      <rect width="170" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="85" y="26" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">Vector Embeddings</text>
      <text x="85" y="46" font-size="10" fill="#94a3b8" text-anchor="middle">128D Float32 Arrays</text>
      <text x="85" y="60" font-size="10" fill="#64748b" text-anchor="middle">(No Raw Images Stored)</text>
    </g>

    <g transform="translate(15, 330)">
      <rect width="170" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="85" y="25" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">SMTP / Ethereal Mailer</text>
    </g>
  </g>
</svg>
