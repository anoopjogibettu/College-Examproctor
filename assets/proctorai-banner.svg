<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200" style="background:#0f172a; border-radius:8px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="200" fill="url(#bgGrad)" rx="8" />

  <!-- Subtle Ambient Glow -->
  <circle cx="110" cy="100" r="70" fill="#2563eb" opacity="0.15" />
  <circle cx="700" cy="50" r="100" fill="#38bdf8" opacity="0.05" />

  <!-- Technical Grid Overlay -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="200" y1="0" x2="200" y2="200" />
    <line x1="400" y1="0" x2="400" y2="200" />
    <line x1="600" y1="0" x2="600" y2="200" />
  </g>

  <!-- Brand Emblem (Shield + Neural Nodes + Eye) -->
  <g transform="translate(60, 45)">
    <!-- Outer Shield Contour -->
    <path d="M50 5 L88 22 C88 65 65 92 50 102 C35 92 12 65 12 22 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Central Eye / Biometric Core -->
    <path d="M28 50 C36 38 64 38 72 50 C64 62 36 62 28 50 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="50" cy="50" r="6" fill="#38bdf8" />
    
    <!-- Facial Landmark Crosshairs -->
    <circle cx="50" cy="30" r="2.5" fill="#818cf8" />
    <circle cx="34" cy="50" r="2.5" fill="#818cf8" />
    <circle cx="66" cy="50" r="2.5" fill="#818cf8" />
    <circle cx="50" cy="72" r="2.5" fill="#818cf8" />
    <line x1="50" y1="33" x2="50" y2="42" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="50" y1="58" x2="50" y2="69" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="2 2" />
  </g>

  <!-- Typography -->
  <g transform="translate(195, 0)">
    <!-- Main Title -->
    <text x="0" y="85" font-size="40" font-weight="800" fill="#f8fafc" letter-spacing="1.5">
      PROCTOR<tspan fill="url(#primaryGrad)">AI</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="118" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      Intelligent Examination &amp; Biometric Proctoring Platform
    </text>

    <!-- Badges / Tags -->
    <g transform="translate(0, 138)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="16" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">FACIAL BIOMETRICS</text>

      <!-- Tag 2 -->
      <rect x="140" y="0" width="145" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="212" y="16" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle">REAL-TIME ANOMALY</text>

      <!-- Tag 3 -->
      <rect x="295" y="0" width="130" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="360" y="16" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">SOCKET.IO SYNC</text>
    </g>
  </g>
</svg>
