<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ProctorAI – Intelligent AI-Powered Online Examination and Biometric Proctoring Platform." />
    <meta name="theme-color" content="#0f172a" />
    <title>ProctorAI Examination Portal</title>

    <!--
      Preconnect to the API backend to eliminate TCP/TLS handshake latency
      from the critical path. AuthContext fires /api/auth/profile immediately
      on mount; AdminDashboard fires sequential XHR requests.
    -->
    <link rel="preconnect" href="http://localhost:5000" />

    <!-- DNS prefetch as a legacy fallback for browsers that don't support preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Preconnect to font origins to eliminate connection setup latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Inter font with display=swap: text renders immediately with a system font
      and swaps to Inter once it loads — prevents invisible text during load (FOIT).
    -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
